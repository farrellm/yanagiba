name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # yanagiba targets fish, which is Unix-only, and locks the history file
        # with flock(2). There is nothing to test on Windows.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: make build

      - name: Test
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: make vet

      # The action supplies its own pinned binary, so it runs the linter
      # directly rather than through `make lint`.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Check formatting
        run: golangci-lint fmt --diff

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod is tidy
        run: make tidy-check
